name: release

on:
  push:
    tags:
      - "v*"
      - "chart-v*"

# packages: write is what publishes to GHCR; contents: read is for the checkout. No
# id-token: write -- nothing here federates to a cloud identity any more. GITHUB_TOKEN carries
# both, so a release needs no repository variable and no stored secret configured beforehand.
permissions:
  contents: read
  packages: write

# The action majors below are the node24 ones (node20 is deprecated). They require Actions
# Runner >= v2.327.1 -- given on ubuntu-latest, a constraint only if this moves to self-hosted.
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/DocInt.slnx
      - run: dotnet build --no-restore src/DocInt.slnx
      - run: dotnet test --no-build src/DocInt.slnx

  image:
    if: ${{ !startsWith(github.ref_name, 'chart-') }}
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7
      # The owning org is spelled Arulero and an OCI reference may not contain capitals, while
      # ${{ github.repository_owner }} expands verbatim. Lowercased HERE, once, and read by both
      # jobs -- docker/metadata-action lowercases its own `images:` input silently, but the chart
      # push has no such helper, so relying on that would leave the chart half correct by accident
      # and the image half correct by a different mechanism. Neither publish depends on the other
      # having normalised anything.
      - name: Lowercase the registry namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Strip v prefix
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.ns.outputs.owner }}/eugo-docint:${{ steps.ver.outputs.version }}
          # Links the GHCR package to this repository. Without the link the package inherits no
          # repository permissions and has to have them granted by hand in package settings.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    needs: [build-test, image]
    if: ${{ always() && needs.build-test.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: azure/setup-helm@v5
      # Recomputed rather than passed from the image job: on a chart-v* tag that job is skipped
      # entirely, so an output read from it would be empty exactly when the chart publishes alone.
      - name: Lowercase the registry namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      # Both logins, deliberately. Helm's OCI client keeps its own credential store and does not
      # read docker/login-action's -- `helm push` against a registry Docker alone is logged into
      # fails with a 401 after the image has already been published.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Helm registry login
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Resolve versions
        id: versions
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          CHART_VERSION="$(sed -n 's/^version: //p' charts/eugo-docint/Chart.yaml)"
          CHART_MM="$(echo "$CHART_VERSION" | cut -d. -f1-2)"
          if [[ "$TAG" == chart-v* ]]; then
            TAG_VERSION="${TAG#chart-v}"
            if [[ "$TAG_VERSION" != "$CHART_VERSION" ]]; then
              echo "::error::tag $TAG says chart $TAG_VERSION but Chart.yaml says $CHART_VERSION"; exit 1
            fi
            APP_VERSION="$(git tag -l "v${CHART_MM}.*" | sort -V | tail -1)"
            if [[ -z "$APP_VERSION" ]]; then
              echo "::error::no image tag v${CHART_MM}.* exists to pair this chart with"; exit 1
            fi
            APP_VERSION="${APP_VERSION#v}"
          else
            APP_VERSION="${TAG#v}"
            APP_MM="$(echo "$APP_VERSION" | cut -d. -f1-2)"
            if [[ "$APP_MM" != "$CHART_MM" ]]; then
              echo "::error::image $APP_VERSION vs chart $CHART_VERSION: major.minor drift"; exit 1
            fi
          fi
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Package chart
        run: |
          set -euo pipefail
          helm package charts/eugo-docint \
            --version "${{ steps.versions.outputs.chart_version }}" \
            --app-version "${{ steps.versions.outputs.app_version }}" \
            --destination /tmp
      # `helm package` validates Chart.yaml metadata but never renders templates -- a chart whose
      # templates cannot render packages with exit 0 and would only fail at `helm install`. Render
      # the packaged artifact (not the working tree) so the exact bytes bound for GHCR are proven;
      # same two value sets as ci.yml's chart-lint job, covering the HPA-on and HPA-off branches.
      # No endpoint values: the chart renders without them, and supplying them here would test a
      # configuration no release necessarily has rather than the artifact as it ships.
      # On a v* tag this runs after the image push, so a failure here leaves a published image with
      # no chart; on a chart-v* tag the image job is skipped and nothing has been published yet.
      - name: Validate packaged chart
        run: |
          set -euo pipefail
          # The filename follows the chart NAME, which is eugo-docint-chart -- `helm package` derives
          # it from Chart.yaml and it is not the name of the rendered resources.
          TGZ="/tmp/eugo-docint-chart-${{ steps.versions.outputs.chart_version }}.tgz"
          helm lint "$TGZ"
          helm template ci "$TGZ" -f charts/eugo-docint/ci/test-values.yaml > /dev/null
          helm template ci "$TGZ" --set autoscaling.enabled=false > /dev/null
      # `helm push` takes a registry NAMESPACE, not a target repository: the repository comes from
      # the packaged Chart.yaml's `name:`, so this resolves to ghcr.io/<owner>/eugo-docint-chart --
      # beside the image and distinct from it. Distinct is the point: chart and image share a
      # major.minor by contract, so one repository holding both would put two different artifacts
      # on the same tag, with the second silently replacing the first.
      - name: Push chart
        run: |
          set -euo pipefail
          helm push "/tmp/eugo-docint-chart-${{ steps.versions.outputs.chart_version }}.tgz" \
            "oci://ghcr.io/${{ steps.ns.outputs.owner }}"
